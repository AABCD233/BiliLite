name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plugins_examples/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 当编译器用：先出 APK，测试失败也不影响拿安装包
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 固定签名自检:CI 每次是新机器,签名证书必须来自仓库,指纹不符直接失败
      - name: Verify APK signature is stable
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          grep -qi "00dc1224dc45800c192740fe77bb8bdaf8024aaba5c49576fd0703b311b06e05" /tmp/certs.txt

      # 每次 push 覆盖同一个「CI 测试包」预发布,不占版本号,方便手机上直接装
      - name: Update CI pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI 测试包（自动更新）
          prerelease: true
          body: |
            每次 push 自动覆盖，仅供测试；正式版见 v* Release。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true
