name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          grep -qi "00dc1224dc45800c192740fe77bb8bdaf8024aaba5c49576fd0703b311b06e05" /tmp/certs.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "BiliLite-${{ github.ref_name }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BiliLite ${{ github.ref_name }}
          body: |
            学习专注型 B 站客户端（二改版）· 基于 HYXTPSP/BiliLite，界面/交互借鉴 PiliPlus。

            **v0.6.1 更新**
            - 修复 UP 空间「投稿」tab 错显示动态、动态加载失败
            - UP 主页视频显示发布日期
            - 投稿新增「视频 / 合集 / 系列」子 tab
            - 播放器新增截图（存相册 Pictures/BiliLite）
            - 新增 PiliPlus 同款字幕设置（字号/全屏字号/描边/边距/背景不透明度）
            - 退出播放页淡出，减少闪跳；新增播放器/系统栏日志
            - 「我的」新增「日志与备份」，支持清空日志
            - 开源声明链接修正（PiliPlus / 本项目）

            **安装说明**
            从上游官方版本切换过来需先卸载一次（签名不同）；本仓库后续版本可直接覆盖安装。
          files: BiliLite-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
